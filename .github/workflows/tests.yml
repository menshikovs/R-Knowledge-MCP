name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The analytics extra (duckdb, pandas, streamlit) is imported by tests that are meant to run.
      - run: python -m pip install -e '.[dev,analytics]'
      - run: ruff check .
      - run: ruff format --check .
      # Report collection problems (import errors) separately from test failures.
      - run: pytest --collect-only -q
      - run: pytest
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
      - name: Check installed CLI
        run: r-knowledge-mcp --help
  # The launcher tests skip when R, termr or testthat are missing, so the main matrix does not run
  # them. This job installs those prerequisites and fails if the tests would still be skipped.
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("termr", "testthat"), repos = c(getOption("repos"), CRAN = "https://cloud.r-project.org"))'
      - run: Rscript -e 'stopifnot(requireNamespace("termr"), requireNamespace("testthat"))'
      - run: python -m pip install -e '.[dev,analytics]'
      - run: echo "BENCH_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Run launcher tests (a skip is a failure here)
        run: |
          set -o pipefail
          pytest tests/test_codex_launcher.py -q -rs | tee launcher.log
          ! grep -q skipped launcher.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t r-knowledge-mcp:test .
      - run: docker run --rm r-knowledge-mcp:test --help

  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' 'maturin>=1.9,<2'
      - name: Build optional PyO3 extension
        run: |
          cd native
          maturin build --release --out target/wheels
          cd ..
          python -m pip install --no-deps native/target/wheels/*.whl
      - name: Rust checks
        working-directory: native
        run: |
          cargo fmt --check
          cargo check --offline
          cargo clippy --offline --release -- -D warnings
          cargo test --offline
      - name: Verify actual bindings and semantic parity
        run: |
          python -c "from cran_knowledge_mcp.native import native; assert native is not None"
          python -m pytest tests/test_native_parity.py tests/test_function_discovery.py tests/test_function_discovery_replay.py tests/test_discovery_status.py tests/test_real_archives.py -q -o usefixtures=r01a_offline_guard
