[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cran-knowledge-mcp"
version = "0.1.0"
description = "Read-only, source-attributed CRAN, Bioconductor and GitHub AGENTS.md knowledge for MCP clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]
analytics = ["duckdb>=1.4,<2", "streamlit>=1.55,<2", "pandas>=2.2,<4"]

[project.scripts]
cran-knowledge-mcp = "cran_knowledge_mcp.server:main"
r-knowledge-mcp = "cran_knowledge_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "." exposes the top-level `benchmarks` package to the `pytest` console script (not only `python -m pytest`).
pythonpath = ["src", "."]
cache_dir = "pytest-cache/data"
markers = ["docker: requires an available Docker engine and the frozen R benchmark image"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "upstream", ".test-tmp", ".pytest-windows-tmp", "audits"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
