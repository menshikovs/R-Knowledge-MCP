[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cran-knowledge-native"
version = "0.1.0"
description = "Optional Rust accelerators for cran-knowledge-mcp (pure-Python fallbacks remain authoritative)."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.maturin]
module-name = "cran_knowledge_native"
features = ["pyo3/extension-module"]
